<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f4ec">
<meta name="description" content="A private reading room for people you know.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Reading Room — Read the news. Talk it through.</title>
<style>
:root{color-scheme:light;--paper:#f7f4ec;--card:#fffdf8;--ink:#132b39;--muted:#66706b;--red:#9d3038;--line:#e4dfd2;font:16px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 0,#fffdf8 0,transparent 48%),var(--paper);color:var(--ink)}main{width:min(100% - 36px,650px);margin:0 auto;padding:calc(30px + env(safe-area-inset-top)) 0 calc(38px + env(safe-area-inset-bottom))}.brand{display:block;width:min(270px,74vw);height:auto;margin:0 auto 48px}.hero{text-align:center;margin:0 auto 28px}h1{font:500 clamp(37px,10vw,56px)/1.06 Georgia,"Times New Roman",serif;letter-spacing:-.045em;margin:0 auto 14px;max-width:590px}.lede{font-size:18px;color:var(--muted);margin:0}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 10px 36px #132b3908}.primary{display:flex;min-height:56px;align-items:center;justify-content:center;padding:14px 20px;background:var(--ink);border-radius:13px;color:white;text-decoration:none;font-weight:700;font-size:16px}.primary:hover{background:#1c3a49}.primary:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:3px}.details{margin:18px 0 0;padding-top:18px;border-top:1px solid var(--line)}.details summary{font-weight:650;cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between}.details summary::-webkit-details-marker{display:none}.details summary:after{content:"+";font:24px/1 Georgia,serif;color:var(--red)}.details[open] summary:after{content:"−"}.form-copy{margin:12px 0;color:var(--muted);font-size:14px}label{display:block;font-size:14px;font-weight:650;margin:15px 0 6px}input{display:block;width:100%;min-height:50px;padding:12px 13px;border:1px solid #c9c5b9;border-radius:11px;background:#fff;color:var(--ink);font:inherit}button{margin-top:10px;min-height:48px;width:100%;padding:12px 16px;border:0;border-radius:11px;background:var(--red);color:#fff;font:650 15px system-ui;cursor:pointer}button:hover{background:#84252d}.error{min-height:1.4em;margin:8px 0 0;color:#92252d;font-size:14px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 2px 0}.step{text-align:center;padding:12px 5px;color:var(--muted);font-size:13px}.step b{display:block;color:var(--red);font:italic 18px Georgia,serif;margin-bottom:3px}.new-here{text-align:center;color:var(--muted);font-size:14px;margin:18px 8px 0}.new-here strong{color:var(--ink);font-weight:600}@media(min-width:560px){main{padding-top:54px}.brand{margin-bottom:58px}.card{padding:28px}.steps{margin-top:28px}}
</style>
</head>
<body>
<main>
  <img class="brand" src="/reading-room-logo.svg" width="430" height="88" alt="Reading Room">
  <header class="hero">
    <h1>Read the news.<br>Talk it through.</h1>
    <p class="lede">A private reading room for people you know.</p>
  </header>
  <section class="card" aria-label="Open your Reading Room">
    <a class="primary" href="/study">Return to your room</a>
    <details class="details">
      <summary>Have an invitation?</summary>
      <p class="form-copy">Paste the invitation link someone shared with you.</p>
      <form id="invitation-form" novalidate>
        <label for="invitation-link">Invitation link</label>
        <input id="invitation-link" name="invitation" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste your invitation link" aria-describedby="invitation-error">
        <button type="submit">Open invitation</button>
        <p class="error" id="invitation-error" role="alert" aria-live="polite"></p>
      </form>
    </details>
  </section>
  <div class="steps" aria-label="How it works">
    <div class="step"><b>Read</b>Follow the story</div>
    <div class="step"><b>Question</b>Look more closely</div>
    <div class="step"><b>Discuss</b>Think together</div>
  </div>
  <p class="new-here"><strong>New here?</strong> Ask someone you know for an invitation.</p>
</main>
<script type="module">
import { invitationDestination } from './welcome-link.mjs';
const form=document.querySelector('#invitation-form');
const field=document.querySelector('#invitation-link');
const error=document.querySelector('#invitation-error');
form.addEventListener('submit',event=>{
  event.preventDefault();
  error.textContent='';
  const destination=invitationDestination(field.value.trim(),location.origin);
  if(!destination){error.textContent='That link does not look like a valid member invitation. Check it with the person who shared it.';return;}
  location.assign(destination);
});
</script>
</body>
</html>
